<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I love you</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
// Kecepatan: jumlah tulisan "I love you" per detik. Makin kecil = makin lambat.
const SPEED = 30;

let points = [];
let drawn = 0;
let last = performance.now();
let acc = 0;

function build() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Sesuaikan ukuran dengan layar (aslinya skala 11-16 untuk layar ~800px)
  const k = Math.min(innerWidth, innerHeight) / 700;
  points = [];
  for (let scale = 11; scale <= 16; scale++) {
    for (let i = 0; i < 120; i++) {
      const a = i * Math.PI * 2 / 120;
      const x = 16 * Math.pow(Math.sin(a), 3) * scale;
      const y = (13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)) * scale;
      points.push([innerWidth / 2 + x * k, innerHeight / 2 - y * k]);
    }
  }
  drawn = 0;
  ctx.clearRect(0, 0, innerWidth, innerHeight);
}

function frame(now) {
  acc += (now - last) / 1000 * SPEED;
  last = now;
  ctx.fillStyle = "#ffb6c1";
  ctx.font = "bold 8px Arial";
  ctx.textAlign = "center";
  while (acc >= 1 && drawn < points.length) {
    ctx.fillText("Hey antek-antek asing", points[drawn][0], points[drawn][1]);
    drawn++;
    acc -= 1;
  }
  requestAnimationFrame(frame);
}

addEventListener("resize", build);
build();
requestAnimationFrame(frame);
</script>
</body>
</html>

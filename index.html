<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>81</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  .bg {
    position: fixed; inset: 0;
    background:
      linear-gradient(rgba(0,0,0,.45), rgba(0,0,0,.45)),
      url("foto.png") center 30% / cover no-repeat;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="c"></canvas>
<script>
// ====== Pengaturan ======
const TEXT  = "hey antek antek asing ";
const SPEED = 60;          // jumlah huruf per detik (makin kecil = makin lambat)
const COLOR = "#ffffff";   // warna tulisan
const RINGS = 3;           // jumlah garis tulisan pada tiap goresan angka
// ========================

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let chars = [], drawn = 0, acc = 0, last = performance.now();

function circle(cx, cy, R) {
  const n = Math.max(60, Math.ceil(2 * Math.PI * R / 2)), pts = [];
  for (let i = 0; i <= n; i++) {
    const a = -Math.PI / 2 + i * 2 * Math.PI / n;
    pts.push([cx + R * Math.cos(a), cy + R * Math.sin(a)]);
  }
  return pts;
}
function line(x1, y1, x2, y2) {
  const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 2)), pts = [];
  for (let i = 0; i <= n; i++) pts.push([x1 + (x2 - x1) * i / n, y1 + (y2 - y1) * i / n]);
  return pts;
}

function layoutAlong(poly, fs) {
  const cum = [0];
  for (let i = 1; i < poly.length; i++)
    cum.push(cum[i - 1] + Math.hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]));
  const total = cum[cum.length - 1], out = [];
  let s = 0, ci = 0, j = 1;
  while (true) {
    const ch = TEXT[ci % TEXT.length];
    const w = ctx.measureText(ch).width;
    const mid = s + w / 2;
    if (mid > total) break;
    while (j < cum.length - 1 && cum[j] < mid) j++;
    const t = (mid - cum[j - 1]) / ((cum[j] - cum[j - 1]) || 1);
    const [x0, y0] = poly[j - 1], [x1, y1] = poly[j];
    if (ch !== " ") out.push({ ch, x: x0 + (x1 - x0) * t, y: y0 + (y1 - y0) * t, a: Math.atan2(y1 - y0, x1 - x0) });
    s += w; ci++;
  }
  return out;
}

function build() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const u = Math.min(innerHeight * 0.85, innerWidth * 0.9);
  const fs = Math.max(8, u * 0.03), gap = fs * 1.35;
  ctx.font = `bold ${fs}px Arial`;
  const ox = innerWidth / 2 + 0.08 * u, oy = innerHeight / 2;

  const polys = [];
  // Angka 8: dua lingkaran bertumpuk
  for (let i = 0; i < RINGS; i++) {
    polys.push(circle(ox - 0.28 * u, oy - 0.25 * u, 0.20 * u - i * gap));
    polys.push(circle(ox - 0.28 * u, oy + 0.20 * u, 0.25 * u - i * gap));
  }
  // Angka 1: batang + bendera
  const x1 = ox + 0.35 * u, top = oy - 0.45 * u, bot = oy + 0.45 * u;
  for (let k = 0; k < RINGS; k++) {
    const dx = (k - (RINGS - 1) / 2) * gap;
    polys.push(line(x1 + dx, top, x1 + dx, bot));
  }
  for (let k = 0; k < RINGS; k++) {
    polys.push(line(x1 - 0.2 * u, top + 0.16 * u + k * gap * 1.15, x1 - gap, top + k * gap * 1.15));
  }

  chars = [];
  polys.forEach(p => chars.push(...layoutAlong(p, fs)));
  drawn = 0; acc = 0;
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.font = `bold ${fs}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = COLOR;
  ctx.shadowColor = "rgba(0,0,0,.85)";
  ctx.shadowBlur = 4;
}

function frame(now) {
  acc += (now - last) / 1000 * SPEED;
  last = now;
  while (acc >= 1 && drawn < chars.length) {
    const c = chars[drawn++];
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.rotate(c.a);
    ctx.fillText(c.ch, 0, 0);
    ctx.restore();
    acc -= 1;
  }
  requestAnimationFrame(frame);
}

addEventListener("resize", build);
build();
requestAnimationFrame(frame);
</script>
</body>
</html>
